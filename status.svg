<svg xmlns="http://www.w3.org/2000/svg" width="560" height="44" viewBox="0 0 560 44" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .b { fill: #7AA2F7; }
    .eye { fill: #0D1117; }
    .tip { fill: #E6EDFF; animation: luz 1.6s steps(1, end) infinite; }
    @keyframes luz { 0% { fill: #E6EDFF; } 50% { fill: #7AA2F7; } }

    /* robô: pula de leve e mexe as pernas */
    .robo { animation: pulo 0.6s steps(1, end) infinite; }
    @keyframes pulo { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .pernaA { animation: passo 0.6s steps(1, end) infinite; }
    .pernaB { animation: passo 0.6s steps(1, end) infinite; animation-delay: -0.3s; }
    @keyframes passo { 0% { opacity: 1; } 50% { opacity: 0; } }

    /* piscada a cada 4 s */
    .olhos { animation: pisca 4s steps(1, end) infinite; }
    @keyframes pisca { 0% { opacity: 1; } 94% { opacity: 0; } 97% { opacity: 1; } }
    .txt { font: 500 20px "Fira Code", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; opacity: 0; }
    .p { animation: frase 9s linear infinite; }
    .p1 { animation-delay: 0s; } .p2 { animation-delay: -6s; } .p3 { animation-delay: -3s; }
    @keyframes frase { 0% { opacity: 0; } 3% { opacity: 1; } 30% { opacity: 1; } 33.33% { opacity: 0; } 100% { opacity: 0; } }
  </style>

  <defs>
    <!-- brilho que passa pelas letras -->
    <linearGradient id="brilho" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#7AA2F7"/>
      <stop offset="0.5" stop-color="#E6EDFF"/>
      <stop offset="1" stop-color="#7AA2F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="560 0" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- robô em pixel -->
  <g transform="translate(0,2)"><g class="robo">
    <rect class="tip" x="26" y="2" width="4" height="4"/><rect class="b" x="26" y="6" width="4" height="4"/><rect class="b" x="10" y="10" width="36" height="20"/><rect class="b" x="6" y="14" width="4" height="8"/><rect class="b" x="46" y="14" width="4" height="8"/>
    <g class="olhos"><rect class="eye" x="18" y="14" width="4" height="8"/><rect class="eye" x="34" y="14" width="4" height="8"/></g>
    <rect class="eye" x="22" y="22" width="12" height="4"/>
    <g class="pernaA"><rect class="b" x="14" y="30" width="4" height="8"/><rect class="b" x="22" y="30" width="4" height="8"/><rect class="b" x="30" y="30" width="4" height="8"/><rect class="b" x="38" y="30" width="4" height="8"/></g>
    <g class="pernaB"><rect class="b" x="14" y="30" width="4" height="4"/><rect class="b" x="18" y="34" width="4" height="4"/><rect class="b" x="30" y="30" width="4" height="4"/><rect class="b" x="34" y="34" width="4" height="4"/><rect class="b" x="22" y="30" width="4" height="4"/><rect class="b" x="38" y="30" width="4" height="4"/></g>
  </g></g>

  <text class="txt p p1" x="64" y="30" fill="url(#brilho)">Automatizando processos…</text>
  <text class="txt p p2" x="64" y="30" fill="url(#brilho)">Analisando dados…</text>
  <text class="txt p p3" x="64" y="30" fill="url(#brilho)">Resolvendo problemas reais…</text>
</svg>
